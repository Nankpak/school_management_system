{% extends 'base.html' %}{% block title %}Sign in | CampusDesk{% endblock %}{% block auth_content %}<main class="auth-page"><div class="auth-brand"><span class="brand-mark">C</span> CampusDesk</div><section class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your<br><em>student space.</em></h1><form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<div class="password-input"><input id="password" type="password" name="password" autocomplete="current-password" required><button type="button" data-toggle-password="#password">Show</button></div></label><button class="button full" type="submit">Sign in ↗</button></form><div class="auth-links"><a href="{% url 'password_reset' %}">Forgot password?</a><span>New here? <a href="{% url 'signup' %}">Create account</a></span></div></section></main>{% endblock %}
