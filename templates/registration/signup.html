{% extends 'base.html' %}{% block title %}Create account | CampusDesk{% endblock %}{% block auth_content %}<main class="auth-page"><div class="auth-brand"><span class="brand-mark">C</span> CampusDesk</div><section class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your<br><em>student account.</em></h1><form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}<div class="password-input">{{ field }}{% if 'password' in field.name %}<button type="button" data-toggle-password="#id_{{ field.name }}">Show</button>{% endif %}</div>{% if field.errors %}<small class="error">{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}<button class="button full" type="submit">Create account ↗</button></form><div class="auth-links"><span>Already registered? <a href="{% url 'login' %}">Sign in</a></span></div></section></main>{% endblock %}
