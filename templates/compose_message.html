{# Message composer: lets a signed-in user choose a recipient and submit a subject and message body. #}{% extends 'base.html' %}{% block title %}New message | CampusDesk{% endblock %}{% block heading %}New message{% endblock %}{% block content %}<section class="panel form-panel"><form method="post">{% csrf_token %}<label>Recipient<select name="recipient" required><option value="">Choose a recipient</option>{% for person in users %}<option value="{{ person.pk }}">{{ person.get_full_name|default:person.username }} ({{ person.username }})</option>{% endfor %}</select></label><label>Subject<input name="subject" required></label><label>Message<textarea name="body" rows="8" required></textarea></label><button class="button" type="submit">Send message ↗</button></form></section>{% endblock %}
